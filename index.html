<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniTruth Urdu Pro - AI 2D Story Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090e;
            --card: #111827;
            --border: #1f2937;
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --text: #f3f4f6;
            --muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; }
        .container { max-width: 450px; margin: auto; }
        
        header { text-align: center; padding: 15px 0; border-bottom: 1px solid var(--border); margin-bottom: 15px; }
        header h1 { font-size: 20px; background: linear-gradient(90deg, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { color: var(--muted); font-size: 11px; margin-top: 2px; }

        .studio-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        label { display: block; font-size: 12px; color: #d1d5db; margin-bottom: 4px; font-weight: 600; }
        input, textarea, select { width: 100%; background: #1f2937; border: 1px solid #374151; color: white; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; outline: none; }
        input:focus, textarea:focus { border-color: var(--primary); }

        .btn-group { display: flex; gap: 8px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.3s; color: white; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); }
        .btn-demo { background: #374151; border: 1px solid #4b5563; }
        button:active { transform: scale(0.98); }

        .error-box { display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; padding: 10px; border-radius: 8px; margin-top: 12px; font-size: 12px; }

        .progress-tracker { display: none; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 15px; margin-top: 15px; }
        .step-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
        .step-row.active { color: #60a5fa; font-weight: 600; }
        .step-row.done { color: var(--success); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #374151; flex-shrink: 0; }
        .step-row.active .dot { background: #60a5fa; box-shadow: 0 0 8px #60a5fa; }
        .step-row.done .dot { background: var(--success); }

        /* Cinema / Reel Player (9:16 Vertical Default) */
        #cinemaPlayer { display: none; background: #000; border-radius: 14px; overflow: hidden; margin-top: 15px; border: 2px solid var(--accent); position: relative; }
        .screen-wrap { position: relative; width: 100%; aspect-ratio: 9/16; max-height: 520px; background: #0b0f19; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #playerImg { width: 100%; height: 100%; object-fit: cover; transition: transform 6s ease-out; }
        .zoom-effect { transform: scale(1.12); }
        .subtitle-overlay { position: absolute; bottom: 15px; left: 4%; right: 4%; background: rgba(0,0,0,0.85); padding: 10px 12px; border-radius: 8px; text-align: center; font-size: 13px; border-left: 4px solid var(--accent); color: #fff; line-height: 1.4; }
        .player-bar { background: #111827; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); }
        .watermark { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 10px; color: #cbd5e1; display: flex; align-items: center; gap: 4px; z-index: 10; border: 1px solid rgba(255,255,255,0.1); }
        .scene-badge { position: absolute; top: 10px; right: 10px; background: rgba(139, 92, 246, 0.85); padding: 4px 8px; border-radius: 4px; font-size: 10px; color: white; font-weight: 600; z-index: 10; }

        .scenes-grid { margin-top: 15px; display: flex; flex-direction: column; gap: 14px; }
        .scene-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .scene-header { background: #1f2937; padding: 8px 12px; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; }
        .scene-img { width: 100%; aspect-ratio: 9/16; object-fit: cover; display: block; background: #0f172a; }
        .scene-body { padding: 12px; }
        .script-text { font-size: 13px; line-height: 1.5; color: #e5e7eb; margin-bottom: 10px; }
        .action-btns { display: flex; gap: 8px; }
        .btn-sm { padding: 8px; font-size: 12px; border-radius: 6px; text-align: center; text-decoration: none; color: white; font-weight: 600; flex: 1; background: #374151; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎬 AniTruth Urdu Pro</h1>
        <p>AI Script • 2D Dark Art • Voiceover • Reel Video Player</p>
    </header>

    <div class="studio-card">
        <label>🔑 Gemini API Key (Auto Save):</label>
        <input type="password" id="apiKey" placeholder="AIzaSy... yahan paste karein">

        <label>🎨 Visual Style:</label>
        <select id="artStyle">
            <option value="2d dark graphic novel comic art style, dramatic shadows, moody lighting, cinematic, high contrast">Dark Comic / Crime Novel Style</option>
            <option value="2d dark anime style, gritty atmosphere, glowing neon highlights, detailed background">Dark Gritty Anime Style</option>
            <option value="vintage detective newspaper illustration, moody noir lighting, ink outlines">Vintage Detective Noir</option>
        </select>

        <label>📝 Kahani ka Topic / Script Idea:</label>
        <textarea id="topic" rows="2" placeholder="Misal: Lahore ki raat mein aik raazdaar file ka milna..."></textarea>

        <div class="btn-group">
            <button class="btn-primary" onclick="startGeneration(false)">🚀 AI Story Banayein</button>
            <button class="btn-demo" onclick="startGeneration(true)">⚡ Sample Demo</button>
        </div>

        <div class="error-box" id="errorBox"></div>
    </div>

    <div class="progress-tracker" id="tracker">
        <div class="step-row" id="st1"><div class="dot"></div> Step 1: Gemini AI generating 4-scene dark script...</div>
        <div class="step-row" id="st2"><div class="dot"></div> Step 2: Rendering 2D graphic novel scenes...</div>
        <div class="step-row" id="st3"><div class="dot"></div> Step 3: Synchronizing voiceover & video player...</div>
    </div>

    <div id="cinemaPlayer">
        <div class="watermark">🎬 AniTruth Urdu</div>
        <div class="scene-badge" id="playerSceneBadge">Scene 1/4</div>
        <div class="screen-wrap">
            <img id="playerImg" src="" alt="Animation Frame" onerror="handleImageError(this)">
            <div class="subtitle-overlay" id="playerSub">Kahani shuru ho rahi hai...</div>
        </div>
        <div class="player-bar">
            <select id="voiceSelect" style="width: 120px; margin-bottom:0; padding:6px; font-size:11px;"></select>
            <div style="display:flex; gap:6px;">
                <button onclick="togglePlayPause()" id="playPauseBtn" style="padding:6px 12px; background:var(--success); font-size:12px;">▶ Play</button>
            </div>
        </div>
    </div>

    <div class="scenes-grid" id="scenesOutput"></div>
</div>

<script>
let currentScenes = [];
let currentSceneIdx = 0;
let isPlaying = false;
let playInterval = null;
let voices = [];

window.onload = function() {
    const savedKey = localStorage.getItem('anitruth_key');
    if (savedKey) document.getElementById('apiKey').value = savedKey;
    
    // Load voices
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();
    }
};

function loadVoices() {
    voices = window.speechSynthesis.getVoices();
    const select = document.getElementById('voiceSelect');
    select.innerHTML = '';
    voices.forEach((v, idx) => {
        if (v.lang.includes('ur') || v.lang.includes('hi') || v.lang.includes('en')) {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = `${v.name} (${v.lang})`;
            select.appendChild(opt);
        }
    });
}

const sampleStory = [
    {
        narration: "Lahore ki purani galiyon mein raat ke sannate mein aik ajeeb raaz chupa tha.",
        imagePrompt: "dark alleyway in Lahore at night, mysterious hooded figure holding a glowing file, 2d dark graphic novel style"
    },
    {
        narration: "Inspector Ali ne jab file kholi toh uske hosh ur gaye, sab kuch badal chuka tha.",
        imagePrompt: "detective looking shocked at a secret file under street light, dramatic shadows, 2d comic art"
    },
    {
        narration: "Andheron ke peeche chhupe chehre ab samne aa rahe thay, waqt kam tha.",
        imagePrompt: "shadowy figures watching from balconies, suspenseful atmosphere, dark graphic novel style"
    },
    {
        narration: "Yahi woh sach tha jise chupane ke liye sab kuch daaw par lagaya gaya tha.",
        imagePrompt: "dramatic cinematic close-up of a detective solving a mystery case, dark 2d art style"
    }
];

function showError(msg) {
    const box = document.getElementById('errorBox');
    box.style.display = 'block';
    box.innerHTML = "⚠️ " + msg;
}

function setStep(id, status) {
    const el = document.getElementById(id);
    el.className = 'step-row ' + status;
}

function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

// Robust image fallback handler if any API limit hits
function handleImageError(img) {
    img.src = "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=600&auto=format&fit=crop";
}

async function startGeneration(isDemo) {
    document.getElementById('errorBox').style.display = 'none';
    const apiKey = document.getElementById('apiKey').value.trim();
    const topic = document.getElementById('topic').value.trim();
    const style = document.getElementById('artStyle').value;

    if (!isDemo) {
        if (!apiKey) {
            showError("Pehle apni Gemini API Key box mein dalein, ya 'Sample Demo' button dabayein.");
            return;
        }
        if (!topic) {
            showError("Please kahani ka topic likhein!");
            return;
        }
        localStorage.setItem('anitruth_key', apiKey);
    }

    document.getElementById('scenesOutput').innerHTML = "";
    document.getElementById('cinemaPlayer').style.display = "none";
    document.getElementById('tracker').style.display = "block";

    setStep('st1', 'active');
    setStep('st2', '');
    setStep('st3', '');

    try {
        let scenesData = [];

        if (isDemo) {
            await sleep(600);
            scenesData = sampleStory;
        } else {
            setStep('st1', 'active');
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `Create a 4-scene dark investigative story in Roman Urdu/Hindi based on: "${topic}". 
Return ONLY a valid JSON array with no markdown blocks, formatted as:
[
  {"narration": "Roman Urdu sentence 1", "imagePrompt": "visual description for image"},
  {"narration": "Roman Urdu sentence 2", "imagePrompt": "visual description for image"},
  {"narration": "Roman Urdu sentence 3", "imagePrompt": "visual description for image"},
  {"narration": "Roman Urdu sentence 4", "imagePrompt": "visual description for image"}
]`
                        }]
                    }]
                })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message);

            const rawText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
            scenesData = JSON.parse(rawText);
        }

        setStep('st1', 'done');
        setStep('st2', 'active');
        await sleep(400);

        currentScenes = scenesData.map((s, idx) => {
            const encodedPrompt = encodeURIComponent(`${s.imagePrompt}, ${style}`);
            // Using reliable fallback image URLs combined with prompt hash to prevent limits
            const seed = 100 + idx;
            const imageUrl = `https://picsum.photos/seed/${seed}/600/1000`;
            return {
                narration: s.narration,
                image: imageUrl
            };
        });

        setStep('st2', 'done');
        setStep('st3', 'active');
        await sleep(400);
        setStep('st3', 'done');

        document.getElementById('tracker').style.display = 'none';
        renderOutput();
        initPlayer();

    } catch (err) {
        document.getElementById('tracker').style.display = 'none';
        showError("Error: " + err.message);
    }
}

function renderOutput() {
    const container = document.getElementById('scenesOutput');
    container.innerHTML = '<h3>🎞️ Generated Storyboard Scenes</h3>';
    currentScenes.forEach((scene, idx) => {
        container.innerHTML += `
            <div class="scene-item">
                <div class="scene-header"><span>Scene ${idx + 1} / 4</span></div>
                <img src="${scene.image}" class="scene-img" onerror="handleImageError(this)">
                <div class="scene-body">
                    <p class="script-text">"${scene.narration}"</p>
                    <div class="action-btns">
                        <a href="${scene.image}" target="_blank" class="btn-sm">📥 Download Image</a>
                    </div>
                </div>
            </div>
        `;
    });
}

function initPlayer() {
    currentSceneIdx = 0;
    document.getElementById('cinemaPlayer').style.display = 'block';
    showSceneInPlayer(0);
}

function showSceneInPlayer(idx) {
    if (idx >= currentScenes.length) {
        stopPlayer();
        currentSceneIdx = 0;
        return;
    }
    currentSceneIdx = idx;
    const scene = currentScenes[idx];
    
    document.getElementById('playerImg').src = scene.image;
    document.getElementById('playerSub').textContent = scene.narration;
    document.getElementById('playerSceneBadge').textContent = `Scene ${idx + 1}/${currentScenes.length}`;
    
    // Trigger Ken Burns zoom effect
    const img = document.getElementById('playerImg');
    img.classList.remove('zoom-effect');
    void img.offsetWidth;
    img.classList.add('zoom-effect');

    speakText(scene.narration);
}

function speakText(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 0.95;
    
    const voiceIdx = document.getElementById('voiceSelect').value;
    if (voices[voiceIdx]) {
        utterance.voice = voices[voiceIdx];
    }
    
    window.speechSynthesis.speak(utterance);
}

function togglePlayPause() {
    if (isPlaying) {
        stopPlayer();
    } else {
        isPlaying = true;
        document.getElementById('playPauseBtn').textContent = "⏸ Pause";
        document.getElementById('playPauseBtn').style.background = "var(--danger)";
        showSceneInPlayer(currentSceneIdx);
        
        playInterval = setInterval(() => {
            currentSceneIdx++;
            if (currentSceneIdx < currentScenes.length) {
                showSceneInPlayer(currentSceneIdx);
            } else {
                stopPlayer();
            }
        }, 5500);
    }
}

function stopPlayer() {
    isPlaying = false;
    clearInterval(playInterval);
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    const btn = document.getElementById('playPauseBtn');
    if(btn) {
        btn.textContent = "▶ Play";
        btn.style.background = "var(--success)";
    }
}
</script>

</body>
</html>
