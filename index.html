<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PUBG 3D Real Rotate</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;overflow:hidden;height:100vh}
#lobby{position:relative;width:100%;height:100vh;background:url('bg.jpg') center/cover no-repeat;overflow:hidden}
.header{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:30}
.profile{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.65);padding:4px 12px 4px 4px;border-radius:6px;cursor:pointer}
.dp{width:44px;height:44px;background:#eab308;color:#000;font-weight:900;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:22px}
.cur{background:rgba(0,0,0,.7);border:1px solid #eab308;padding:6px 12px;border-radius:4px;font-weight:900;color:#eab308;font-size:13px}
/* CHARACTER 3D STAGE */
#stage{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:270px;height:70%;z-index:20;cursor:grab;perspective:1000px}
#spinner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .08s}
#spinner img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 25px 25px rgba(0,0,0,.8));backface-visibility:hidden}
#backImg{transform:rotateY(180deg)}
#shadow{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);width:190px;height:22px;background:radial-gradient(ellipse,rgba(0,0,0,.65),transparent);border-radius:50%;z-index:10}
.bottom{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-end;z-index:30}
.start{background:#facc15;color:#000;font-size:26px;font-weight:900;padding:12px 55px;border:none;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%)}
.menu{display:flex;gap:8px}.menu div{background:rgba(15,23,42,.9);border:1px solid #fff;padding:8px 14px;border-radius:6px;color:#facc15;font-weight:900;font-size:11px}
#timerBanner{position:absolute;top:65px;left:50%;transform:translateX(-50%);background:#e11d48;color:#fff;padding:8px 18px;border-radius:6px;font-weight:900;display:none;z-index:50}
#ucPop{position:absolute;top:92px;left:50%;transform:translateX(-50%);background:#ffcc00;color:#000;font-weight:900;padding:8px 16px;border-radius:20px;display:none;z-index:50}
#set{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;justify-content:center;align-items:center}
.modal{background:#0f172a;border:2px solid #facc15;width:400px;max-width:92%;padding:22px;border-radius:10px;color:#fff}
.modal label{display:block;font-size:13px;color:#94a3b8;margin:12px 0 5px}.modal input,.modal select{width:100%;padding:10px;background:#1e293b;border:1px solid #475569;color:#fff;border-radius:6px}.btns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.save{background:#10b981;color:#fff;border:none;padding:10px 18px;border-radius:6px;font-weight:900}.cancel{background:#ef4444;color:#fff;border:none;padding:10px 18px;border-radius:6px;font-weight:900}
</style></head><body>
<div id="lobby">
<div class="header"><div class="profile" id="dpClick"><div class="dp">M</div><div><div style="font-weight:900;color:#fff">MINE</div><div style="font-size:10px;color:#aaa">Ace Dominator</div></div></div>
<div style="display:flex;gap:8px"><div class="cur">UC <span id="ucDisplay" style="color:#fff">0</span></div><div class="cur">BP 45,200</div><div class="cur">MAT <span id="matDisplay">15</span></div></div></div>
<div id="shadow"></div>
<div id="stage"><div id="spinner"><img id="frontImg" src="front.png"><img id="backImg" src="back.png"></div></div>
<div class="bottom"><button class="start" onclick="alert('Matchmaking Started...')">START</button><div class="menu"><div>THEME</div><div>CARDS</div><div>INVENTORY</div></div></div>
<div id="timerBanner">UC Timer: <span id="timeLeft">0</span>s</div><div id="ucPop"></div>
</div>
<div id="set"><div class="modal"><h3 style="color:#facc15">⚙️ Hidden Settings</h3>
<label>UC</label><input type="number" id="inputUc" value="10000">
<label>Timer</label><select id="inputTimer"><option value="30">30 Sec</option><option value="60" selected>1 Min</option><option value="120">2 Min</option></select>
<label>Materials</label><input type="number" id="inputMaterials" value="50">
<div class="btns"><button class="cancel" onclick="document.getElementById('set').style.display='none'">Cancel</button><button class="save" onclick="saveSettings()">Apply</button></div></div></div>
<script>
let c=0,l=0;document.getElementById('dpClick').addEventListener('click',()=>{let n=Date.now();if(n-l>1500)c=0;l=n;c++;if(c>=5){c=0;document.getElementById('set').style.display='flex'}});
let ry=0,down=false,sx=0,spin=document.getElementById('spinner'),stage=document.getElementById('stage');
function apply(){spin.style.transform='rotateY('+ry+'deg)'}
stage.addEventListener('touchstart',e=>{down=true;sx=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchmove',e=>{if(!down)return;let dx=e.touches[0].clientX-sx;sx=e.touches[0].clientX;ry+=dx*0.9;apply()},{passive:true});
stage.addEventListener('touchend',()=>down=false);
stage.addEventListener('mousedown',e=>{down=true;sx=e.clientX});
window.addEventListener('mousemove',e=>{if(!down)return;let dx=e.clientX-sx;sx=e.clientX;ry+=dx*0.9;apply()});
window.addEventListener('mouseup',()=>down=false);
stage.addEventListener('click',()=>{let target=ry+360;let iv=setInterval(()=>{ry+=12;apply();if(ry>=target){clearInterval(iv)}},16)});
function saveSettings(){let uc=parseInt(document.getElementById('inputUc').value)||0;let delay=parseInt(document.getElementById('inputTimer').value)||60;let mat=parseInt(document.getElementById('inputMaterials').value)||10;document.getElementById('matDisplay').textContent=mat;document.getElementById('set').style.display='none';let rem=delay;let b=document.getElementById('timerBanner');b.style.display='block';document.getElementById('timeLeft').textContent=rem;let iv=setInterval(()=>{rem--;document.getElementById('timeLeft').textContent=rem;if(rem<=0){clearInterval(iv);b.style.display='none';document.getElementById('ucDisplay').textContent=uc.toLocaleString();let p=document.getElementById('ucPop');p.textContent='+'+uc.toLocaleString()+' UC Aayi!';p.style.display='block';setTimeout(()=>p.style.display='none',3000);}},1000);}
</script></body></html>
