<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniTruth Pro - AI 2D Story Studio</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --card: #111827;
            --border: #1f2937;
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --text: #f3f4f6;
            --muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; }
        .container { max-width: 850px; margin: auto; }
        
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        header h1 { font-size: 24px; background: linear-gradient(90deg, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { color: var(--muted); font-size: 12px; margin-top: 4px; }

        .studio-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        label { display: block; font-size: 13px; color: #d1d5db; margin-bottom: 6px; font-weight: 600; }
        input, textarea, select { width: 100%; background: #1f2937; border: 1px solid #374151; color: white; padding: 12px; border-radius: 10px; font-size: 14px; margin-bottom: 15px; outline: none; }
        input:focus, textarea:focus { border-color: var(--primary); }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button { flex: 1; padding: 14px; border: none; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.3s; color: white; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); }
        .btn-demo { background: #374151; border: 1px solid #4b5563; }
        button:active { transform: scale(0.98); }

        .error-box { display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; padding: 12px; border-radius: 10px; margin-top: 15px; font-size: 13px; }

        .progress-tracker { display: none; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-top: 20px; }
        .step-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
        .step-row.active { color: #60a5fa; font-weight: 600; }
        .step-row.done { color: var(--success); }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #374151; flex-shrink: 0; }
        .step-row.active .dot { background: #60a5fa; box-shadow: 0 0 10px #60a5fa; }
        .step-row.done .dot { background: var(--success); }

        #cinemaPlayer { display: none; background: #000; border-radius: 16px; overflow: hidden; margin-top: 20px; border: 2px solid var(--accent); }
        .screen-wrap { position: relative; width: 100%; height: 320px; overflow: hidden; }
        #playerImg { width: 100%; height: 100%; object-fit: cover; transition: transform 8s ease-out; }
        .zoom-effect { transform: scale(1.15); }
        .subtitle-overlay { position: absolute; bottom: 15px; left: 4%; right: 4%; background: rgba(0,0,0,0.82); padding: 10px 14px; border-radius: 10px; text-align: center; font-size: 14px; border-left: 4px solid var(--accent); }
        .player-bar { background: #111827; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }

        .scenes-grid { margin-top: 20px; display: flex; flex-direction: column; gap: 18px; }
        .scene-item { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .scene-header { background: #1f2937; padding: 10px 15px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; }
        .scene-img { width: 100%; max-height: 320px; object-fit: cover; display: block; background: #0f172a; }
        .scene-body { padding: 15px; }
        .script-text { font-size: 14px; line-height: 1.6; color: #e5e7eb; margin-bottom: 12px; }
        .action-btns { display: flex; gap: 10px; }
        .btn-sm { padding: 10px; font-size: 13px; border-radius: 8px; text-align: center; text-decoration: none; color: white; font-weight: 600; flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎬 AniTruth AI Story Studio</h1>
        <p>Script • 2D Dark Animation Art • AI Voiceover • Auto Video Preview</p>
    </header>

    <div class="studio-card">
        <label>🔑 Gemini API Key (AIzaSy... wali key dalein - Auto Save hogi):</label>
        <input type="password" id="apiKey" placeholder="AIzaSy... yahan paste karein">

        <label>🎨 Animation Art Style:</label>
        <select id="artStyle">
            <option value="2d dark graphic novel comic art style, dramatic shadows, moody lighting, cinematic">Dark Comic / Investigative 2D Style</option>
            <option value="2d funny cartoon animation style, vibrant colors, expressive characters, clean line art">Funny 2D Cartoon Style</option>
            <option value="2d dark anime style, gritty atmosphere, glowing highlights, detailed background">Dark Gritty Anime Style</option>
        </select>

        <label>📝 Apni Kahani ka Topic Likhein:</label>
        <textarea id="topic" rows="3" placeholder="Misal: Do pakke doston ki ek funny kahani jo exam mein nakal karne ka plan banate hain..."></textarea>

        <div class="btn-group">
            <button class="btn-primary" onclick="startGeneration(false)">🚀 AI Story Banayein</button>
            <button class="btn-demo" onclick="startGeneration(true)">⚡ Sample Demo Chalayein</button>
        </div>

        <div class="error-box" id="errorBox"></div>
    </div>

    <div class="progress-tracker" id="tracker">
        <div class="step-row" id="st1"><div class="dot"></div> Step 1: AI aapki kahani ka script likh raha hai...</div>
        <div class="step-row" id="st2"><div class="dot"></div> Step 2: 2D Animation images ban rahi hain...</div>
        <div class="step-row" id="st3"><div class="dot"></div> Step 3: Voiceover aur Video Player tayyar ho raha hai...</div>
    </div>

    <div id="cinemaPlayer">
        <div class="screen-wrap">
            <img id="playerImg" src="" alt="Animation Frame">
            <div class="subtitle-overlay" id="playerSub">Kahani shuru ho rahi hai...</div>
        </div>
        <div class="player-bar">
            <span id="sceneIndicator" style="font-size:13px; color:#9ca3af;">Scene 1 / 4</span>
            <button onclick="playFullStory()" style="flex:none; padding:8px 16px; background:var(--success); font-size:13px;">▶️ Play Full Video</button>
        </div>
    </div>

    <div class="scenes-grid" id="scenesOutput"></div>
</div>

<script>

};

function showError(msg) {
    const box = document.getElementById('errorBox');
    box.style.display = 'block';
    box.innerHTML = "⚠️ " + msg;
}

    document.getElementById('errorBox').style.display = 'none';
    const apiKey = document.getElementById('apiKey').value.trim();

    if (!isDemo) {

            showError("Please kahani ka topic likhein!");

        }
        localStorage.setItem('gemini_story_key', apiKey);

    setStep('st3', '');

    try {
        let scenesData = [];

        if (isDemo) {
            await sleep(800);
            scenesData = sampleStory;
        } else {
